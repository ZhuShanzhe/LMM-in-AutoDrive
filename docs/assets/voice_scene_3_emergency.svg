  <text x="40" y="32" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#e5edf6">Scene 3 - Emergency Response (6 km)</text>
  <text x="40" y="76" font-family="Arial, sans-serif" font-size="13" fill="#b8c7d9">Rainy night expressway / cone taper / narrowed work zone / no U-turn</text>
