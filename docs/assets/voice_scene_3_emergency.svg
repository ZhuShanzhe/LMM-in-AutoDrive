  <g font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff"><rect x="103" y="285" width="112" height="20" rx="3" fill="#24364b" opacity="0.96"/><text x="111" y="299">S3-01  1100 m</text><rect x="332" y="285" width="112" height="20" rx="3" fill="#24364b" opacity="0.96"/><text x="340" y="299">S3-02  1500 m</text><rect x="556" y="285" width="112" height="20" rx="3" fill="#24364b" opacity="0.96"/><text x="564" y="299">S3-03  1900 m</text><rect x="870" y="285" width="112" height="20" rx="3" fill="#24364b" opacity="0.96"/><text x="878" y="299">S3-04  1500 m</text></g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#dce8f5"><line x1="55" y1="435" x2="85" y2="435" stroke="#4fc3f7" stroke-width="7"/><text x="93" y="440">ego route</text><circle cx="210" cy="435" r="8" fill="#20b7c7"/><text x="225" y="440">C = voice trigger</text><path d="M440 424l9 18h-18z" fill="#ffb300"/><text x="457" y="440">E = visible event actor</text></g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" fill="#1f2937"><text x="1130" y="54" font-size="20" font-weight="700">语音指令</text><text x="1130" y="77" font-size="12" fill="#64748b">低照度与雨雾条件下的模糊化 / 应急式口令</text><g font-size="13"><text x="1130" y="110"><tspan font-weight="700" fill="#075967">C1  0 m</tspan><tspan dx="10">前方路况危险，保持安全车速。</tspan></text><text x="1130" y="147"><tspan font-weight="700" fill="#075967">C2  500 m</tspan><tspan dx="10">能见度差，保持右侧车道，车速不高于40公里每小时。</tspan></text><text x="1130" y="184"><tspan font-weight="700" fill="#075967">C3  1050 m</tspan><tspan dx="10">突发车辆加塞，紧急避让。</tspan></text><text x="1130" y="221"><tspan font-weight="700" fill="#075967">C4  1850 m</tspan><tspan dx="10">施工路段，减速并道至左侧车道。</tspan></text><text x="1130" y="258"><tspan font-weight="700" fill="#075967">C5  3100 m</tspan><tspan dx="10">看到锥形桶和临时横穿行人，保持低速，必要时停车。</tspan></text><text x="1130" y="295"><tspan font-weight="700" fill="#075967">C6  4250 m</tspan><tspan dx="10">前方施工车辆占道，左侧安全时绕行，否则停车等待。</tspan></text><text x="1130" y="332"><tspan font-weight="700" fill="#075967">C7  5200 m</tspan><tspan dx="10">驶离施工路段后，保持安全速度行驶至终点。</tspan></text></g><line x1="1130" y1="355" x2="1530" y2="355" stroke="#e2e8f0"/><text x="1130" y="379" font-size="12" fill="#7c2d12">E1：加塞车辆  E2：施工卡车  E3：临时横穿工作人员</text><text x="1130" y="401" font-size="12" fill="#7c2d12">E4：部分占道维护车；三角形：渐进式锥桶收窄区</text></g>
</svg>
