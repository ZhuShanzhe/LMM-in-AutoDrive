  <text x="40" y="32" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">Scene 2 - Complex Avoidance (8 km)</text>
  <text x="40" y="76" font-family="Arial, sans-serif" font-size="13" fill="#556274">Cloudy dusk / mixed traffic / E markers are visible scripted actors</text>
