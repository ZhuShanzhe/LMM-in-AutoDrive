  <g font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff"><rect x="98" y="157" width="112" height="20" rx="3" fill="#334155" opacity="0.92"/><text x="106" y="171">S2-01  1100 m</text><rect x="345" y="174" width="112" height="20" rx="3" fill="#334155" opacity="0.92"/><text x="353" y="188">S2-02  1200 m</text><rect x="475" y="328" width="112" height="20" rx="3" fill="#334155" opacity="0.92"/><text x="483" y="342">S2-03  1300 m</text><rect x="610" y="271" width="112" height="20" rx="3" fill="#334155" opacity="0.92"/><text x="618" y="285">S2-04  1600 m</text><rect x="770" y="160" width="112" height="20" rx="3" fill="#334155" opacity="0.92"/><text x="778" y="174">S2-05  1600 m</text><rect x="918" y="282" width="112" height="20" rx="3" fill="#334155" opacity="0.92"/><text x="926" y="296">S2-06  1200 m</text></g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#334155"><line x1="55" y1="475" x2="85" y2="475" stroke="#1976d2" stroke-width="7"/><text x="93" y="480">ego route</text><circle cx="210" cy="475" r="8" fill="#20b7c7"/><text x="225" y="480">C = voice trigger</text><rect x="430" y="466" width="22" height="17" fill="#fff7ed" stroke="#cf6d00" stroke-width="3"/><text x="465" y="480">E = visible event actor</text></g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" fill="#1f2937"><text x="1130" y="54" font-size="20" font-weight="700">语音指令</text><text x="1130" y="77" font-size="12" fill="#64748b">每条指令均包含至少 3 个顺序动作</text><g font-size="12"><text x="1130" y="106"><tspan font-weight="700" fill="#075967">C1  0 m</tspan><tspan dx="8">保持当前车道，减速至45公里每小时，</tspan><tspan x="1130" dy="16">通过前方路口后继续直行。</tspan></text><text x="1130" y="151"><tspan font-weight="700" fill="#075967">C2  760 m</tspan><tspan dx="8">看到前方横穿马路的行人，</tspan><tspan x="1130" dy="16">减速避让后向左变道超越慢车。</tspan></text><text x="1130" y="196"><tspan font-weight="700" fill="#075967">C3  1650 m</tspan><tspan dx="8">前方公交站有行人上下车，</tspan><tspan x="1130" dy="16">靠边减速至30公里每小时，确认安全后继续行驶。</tspan></text><text x="1130" y="241"><tspan font-weight="700" fill="#075967">C4  2750 m</tspan><tspan dx="8">前方十字路口左转，进入左侧</tspan><tspan x="1130" dy="16">第二车道并保持40公里每小时。</tspan></text><text x="1130" y="286"><tspan font-weight="700" fill="#075967">C5  3850 m</tspan><tspan dx="8">右侧有自行车，减速并向左避让，</tspan><tspan x="1130" dy="16">超过后回到右侧车道。</tspan></text><text x="1130" y="331"><tspan font-weight="700" fill="#075967">C6  5050 m</tspan><tspan dx="8">前方慢车，确认左侧安全后变道超越，</tspan><tspan x="1130" dy="16">超过后回到原车道。</tspan></text><text x="1130" y="376"><tspan font-weight="700" fill="#075967">C7  6450 m</tspan><tspan dx="8">前方路口右转前减速至30公里每小时，</tspan><tspan x="1130" dy="16">右转后保持当前车道继续行驶。</tspan></text><text x="1130" y="421"><tspan font-weight="700" fill="#075967">C8  7250 m</tspan><tspan dx="8">在前方允许掉头处减速，确认对向车流</tspan><tspan x="1130" dy="16">安全后掉头驶向终点。</tspan></text></g><line x1="1130" y1="453" x2="1530" y2="453" stroke="#e2e8f0"/><text x="1130" y="473" font-size="11" fill="#7c2d12">E1 慢车  E2 横穿行人  E3 公交站  E4 乘客  E5 自行车  E6 安全间隙</text></g>
</svg>
