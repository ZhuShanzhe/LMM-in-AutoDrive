<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="460" viewBox="0 0 1580 460">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0L0 0 0 25" fill="none" stroke="#d7dde5" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1976d2"/></marker>
  </defs>
  <rect width="1580" height="460" fill="#f6f8fb"/>
  <rect x="20" y="50" width="1060" height="360" fill="url(#grid)" stroke="#aeb8c5"/>
  <rect x="1100" y="20" width="460" height="410" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="32" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">Scene 1 - Basic Voice Control (5 km)</text>
  <text x="40" y="76" font-family="Arial, sans-serif" font-size="13" fill="#556274">Clear day / no dynamic actors / topology sketch only</text>
  <path d="M90 145H385V300H700V145H970" fill="none" stroke="#667485" stroke-width="60" stroke-linejoin="round"/>
  <path d="M90 145H385V300H700V145H970" fill="none" stroke="#f5f7fa" stroke-width="4" stroke-dasharray="14 10"/>
  <path d="M90 145H385V300H700V145H970" fill="none" stroke="#1976d2" stroke-width="8" marker-end="url(#arrow)"/>
  <g fill="#20b7c7" stroke="#075967" stroke-width="2"><circle cx="90" cy="145" r="12"/><circle cx="235" cy="145" r="12"/><circle cx="335" cy="145" r="12"/><circle cx="385" cy="230" r="12"/><circle cx="520" cy="300" r="12"/><circle cx="650" cy="300" r="12"/><circle cx="700" cy="220" r="12"/><circle cx="875" cy="145" r="12"/></g>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#075967"><text x="74" y="120">C1</text><text x="219" y="120">C2</text><text x="319" y="120">C3</text><text x="402" y="235">C4</text><text x="504" y="275">C5</text><text x="634" y="275">C6</text><text x="717" y="225">C7</text><text x="859" y="120">C8</text></g>
  <g fill="#fff7ed" stroke="#cf6d00" stroke-width="3"><circle cx="385" cy="145" r="24"/><circle cx="385" cy="300" r="24"/><circle cx="700" cy="300" r="24"/></g>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7c2d12"><text x="371" y="150">J1</text><text x="371" y="305">J2</text><text x="686" y="305">J3</text></g>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff"><rect x="105" y="165" width="104" height="21" rx="3" fill="#334155" opacity="0.92"/><text x="115" y="180">S1-01  700 m</text><rect x="407" y="187" width="104" height="21" rx="3" fill="#334155" opacity="0.92"/><text x="417" y="202">S1-02  800 m</text><rect x="447" y="327" width="112" height="21" rx="3" fill="#334155" opacity="0.92"/><text x="457" y="342">S1-03  1200 m</text><rect x="722" y="245" width="112" height="21" rx="3" fill="#334155" opacity="0.92"/><text x="732" y="260">S1-04  1200 m</text><rect x="788" y="168" width="112" height="21" rx="3" fill="#334155" opacity="0.92"/><text x="798" y="183">S1-05  1100 m</text></g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#334155"><line x1="55" y1="435" x2="85" y2="435" stroke="#1976d2" stroke-width="7"/><text x="93" y="440">ego route</text><circle cx="210" cy="435" r="8" fill="#20b7c7"/><text x="225" y="440">C = voice trigger</text><circle cx="440" cy="435" r="11" fill="#fff7ed" stroke="#cf6d00" stroke-width="3"/><text x="458" y="440">J = junction node</text></g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" fill="#1f2937"><text x="1130" y="54" font-size="20" font-weight="700">语音指令</text><text x="1130" y="79" font-size="12" fill="#64748b">编号与触发里程对应左侧路线图</text><g font-size="13"><text x="1130" y="110"><tspan font-weight="700" fill="#075967">C1  0 m</tspan><tspan dx="10">保持当前车道，提速至60公里每小时。</tspan></text><text x="1130" y="147"><tspan font-weight="700" fill="#075967">C2  450 m</tspan><tspan dx="10">向左变道。</tspan></text><text x="1130" y="184"><tspan font-weight="700" fill="#075967">C3  700 m</tspan><tspan dx="10">前方300米路口右转。</tspan></text><text x="1130" y="221"><tspan font-weight="700" fill="#075967">C4  1400 m</tspan><tspan dx="10">减速至40公里每小时。</tspan></text><text x="1130" y="258"><tspan font-weight="700" fill="#075967">C5  1800 m</tspan><tspan dx="10">下一个路口左转。</tspan></text><text x="1130" y="295"><tspan font-weight="700" fill="#075967">C6  2500 m</tspan><tspan dx="10">向右变道。</tspan></text><text x="1130" y="332"><tspan font-weight="700" fill="#075967">C7  3200 m</tspan><tspan dx="10">前方允许掉头处掉头。</tspan></text><text x="1130" y="369"><tspan font-weight="700" fill="#075967">C8  4100 m</tspan><tspan dx="10">保持当前车道，以50公里每小时行驶至终点。</tspan></text></g><line x1="1130" y1="391" x2="1530" y2="391" stroke="#e2e8f0"/><text x="1130" y="414" font-size="12" fill="#7c2d12">J1：右转路口  J2：左转路口  J3：合法掉头节点</text></g>
</svg>
