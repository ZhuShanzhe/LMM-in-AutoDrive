asr:
  model_id_or_path: "models/Qwen3-ASR-1.7B"
  device: null                        
  num_gpus: 1                          # number of GPUs to use; 1 degenerates to cuda:0
  dtype: "bfloat16"
  attn_implementation: null            # "flash_attention_2" if installed
  language: null                       # null -> auto; e.g. "Chinese"
  backend: "pytorch"                   # pytorch | onnx | j6p (j6p runs the compiled .hbm)
  onnx_path: "outputs/compression/onnx/asr_encoder.onnx"
  hbm_path: "outputs/deployment/j6p/asr_encoder.hbm"
  hbm_mel_frames: 3000

optimization:
  enabled: true
  config: "configs/asr/optimization.yaml"
  fallback_on_failure: true      # if optimization fails or returns empty, retry with the raw audio

translation:
  enabled: true
  model_id_or_path: "models/Qwen3-1.7B"
  device_map: null                 
  num_gpus: 1                          # number of GPUs to use; 1 degenerates to cuda:0
  dtype: "bfloat16"

output:
  language: "english"                  # chinese | english | both
  dir: "outputs"

guard:
  enabled: false

raise_on_error: false